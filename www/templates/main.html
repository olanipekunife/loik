<!--
Create tabs with an icon and label, using the tabs-positive style.
Each tab's child <ion-nav-view> directive will have its own
navigation history that also transitions its views in and out.
-->



<ion-side-menus enable-menu-with-back-views="true">
  <ion-side-menu-content>
 <ion-nav-bar class="bar-dark">
  <ion-nav-back-button>
      </ion-nav-back-button>
    <ion-nav-buttons side="left">
        <img src="img/logo.png" class="backlogo" />
      </ion-nav-buttons>
       <ion-nav-buttons side="right">
        <button class="button button-icon button-clear ion-navicon" menu-toggle="right">
        </button>
      </ion-nav-buttons>
        <ion-nav-back-button>
      </ion-nav-back-button>
    </ion-nav-bar>
 <ion-nav-view name="menu" animation="slide-left-right"></ion-nav-view>
    


  </ion-side-menu-content>

   <!-- Side Menu (right) -->
  <ion-side-menu side="right" >
    <ion-header-bar class="bar-dark">
      <h1 class="title">CourseHero</h1>
    </ion-header-bar>
    <ion-content  class="men" padding="true">
      <ion-list  >
      <div class="item item-avatar viewopacity">
    <img src="{{auth.profile.picture}}" alt="picture">
    <h2>{{auth.profile.name}}</h2>
    <p>{{auth.profile.username}}</p>
  </div>
        <ion-item menu-close class="viewopacity" ui-sref="home">
         Home
        </ion-item>
          <ion-item menu-close class="viewopacity"  ui-sref="login">
          login
        </ion-item>
         <ion-item menu-close class="viewopacity" href="#/menu/courses/{{level}}/{{department}}" >
         Courses
        </ion-item>
      
        
      </ion-list>
    </ion-content>
  </ion-side-menu>
</ion-side-menus>
